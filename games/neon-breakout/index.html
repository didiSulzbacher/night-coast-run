<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neon Breakout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow+Semi+Condensed:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#fff4e2;--muted:#c9c2d6;--sun:#f6c453;--pink:#ff5fd2;--cyan:#4ff0e0;--bg:#0b0a16;--edge:rgba(255,244,226,.2);--panel:rgba(14,12,30,.9)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);
  font-family:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#app{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
canvas{display:block;border-radius:10px;box-shadow:0 0 0 1px rgba(79,240,224,.25),0 0 40px rgba(79,240,224,.12)}
.overlay{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;padding:20px 16px;overflow-y:auto;
  background:linear-gradient(rgba(11,10,22,.6),rgba(11,10,22,.92));z-index:3}
.overlay[hidden]{display:none}
.panel{max-width:520px;width:100%;margin:auto;text-align:center}
.homelink{display:inline-block;color:var(--muted);font-weight:700;font-size:15px;text-decoration:none;border:1.5px solid var(--edge);border-radius:999px;padding:5px 12px}
.homelink:hover,.homelink:focus-visible{color:var(--ink);border-color:var(--cyan)}
.title{font-family:Bungee,Impact,sans-serif;font-weight:400;font-size:clamp(42px,11vw,78px);line-height:.92;margin:10px 0 0;color:var(--cyan);
  text-shadow:0 0 18px rgba(79,240,224,.7),0 4px 0 #1c7d74}
.title span{color:var(--pink);text-shadow:0 0 18px rgba(255,95,210,.7),0 4px 0 #8a2a73}
.lede{font-size:clamp(17px,2.6vw,20px);line-height:1.4;margin:14px auto 18px;max-width:36ch}
.big{font:inherit;font-weight:700;font-size:20px;color:#0b0a16;background:var(--cyan);border:0;border-radius:999px;padding:13px 30px;cursor:pointer;
  box-shadow:0 5px 0 #1c7d74;margin:5px}
.big.pink{background:var(--pink);box-shadow:0 5px 0 #8a2a73}
.big.alt{background:var(--sun);box-shadow:0 5px 0 #b9832a}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #1c7d74}
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:340px;margin:16px auto 6px}
.levels button{font:700 17px/1 Bungee,Impact,sans-serif;color:var(--ink);background:rgba(255,255,255,.06);border:2px solid var(--edge);border-radius:10px;
  aspect-ratio:1;cursor:pointer}
.levels button.boss{border-color:var(--pink);color:var(--pink)}
.levels button:disabled{opacity:.25;cursor:default}
.sub{color:var(--muted);font-size:15px;margin:4px 0 0}
.rec{color:var(--muted);font-size:17px;margin:14px 0 0}
.rec b{font-family:Bungee,Impact,sans-serif;font-weight:400;color:var(--sun)}
.keys{color:var(--muted);font-size:15px;margin:16px auto 0;line-height:1.6}
.keys b{color:var(--ink)}
.pw{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;text-align:left;max-width:330px;margin:14px auto 0;font-size:15px;color:var(--muted)}
.pw i{font:400 13px/22px Bungee,Impact,sans-serif;font-style:normal;width:30px;height:22px;border-radius:6px;text-align:center;color:#0b0a16}

#editBar{position:absolute;left:0;right:0;bottom:0;padding:8px 10px max(10px,env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;gap:6px;
  justify-content:center;background:var(--panel);border-top:1px solid var(--edge);z-index:2}
#editBar[hidden]{display:none}
.sw{width:38px;height:30px;border-radius:7px;border:2px solid transparent;cursor:pointer;font:400 13px Bungee,Impact,sans-serif;color:#0b0a16}
.sw[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 10px #fff}
.tool{font:inherit;font-weight:700;font-size:15px;color:var(--ink);background:rgba(255,255,255,.08);border:1.5px solid var(--edge);border-radius:999px;padding:5px 12px;cursor:pointer}
.tool.go{background:var(--cyan);color:#0b0a16;border-color:var(--cyan)}
.toast{position:absolute;left:50%;top:18px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--edge);border-radius:999px;
  padding:6px 16px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;z-index:4}
.toast.on{opacity:1}
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>

  <div id="editBar" hidden>
    <div id="palette" style="display:flex;gap:5px;flex-wrap:wrap;justify-content:center"></div>
    <button class="tool go" id="eTest">Play test</button>
    <button class="tool" id="eClear">Clear</button>
    <button class="tool" id="eCopy">Copy code</button>
    <button class="tool" id="ePaste">Load code</button>
    <button class="tool" id="eDone">Done</button>
  </div>
  <div class="toast" id="toast"></div>

  <div class="overlay" id="menu">
    <div class="panel">
      <a class="homelink" href="../../">&larr; All games</a>
      <h1 class="title">Neon <span>Breakout</span></h1>
      <p class="lede">Smash every brick, catch the power-ups, and take down a boss every fifth level.</p>
      <button class="big" id="playBtn">Play</button>
      <div class="levels" id="levels"></div>
      <p class="sub">Pick any level you've reached. Pink ones are boss fights.</p>
      <div style="margin-top:14px">
        <button class="big alt" id="editBtn">Level editor</button>
        <button class="big pink" id="customBtn">Play my level</button>
      </div>
      <p class="rec" id="rec"></p>
      <p class="keys">Mouse, touch or <b>&larr; &rarr;</b> to move &middot; <b>Click</b>, <b>tap</b> or <b>Space</b> to launch &middot; <b>P</b> pause</p>
      <div class="pw" id="pwList"></div>
    </div>
  </div>

  <div class="overlay" id="pause" hidden>
    <div class="panel">
      <h2 class="title">Paused</h2>
      <div style="margin-top:18px">
        <button class="big" id="resumeBtn">Resume</button>
        <button class="big pink" id="quitBtn">Quit to menu</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="over" hidden>
    <div class="panel">
      <h2 class="title" id="overTitle">Game over</h2>
      <p class="lede" id="overText"></p>
      <button class="big" id="retryBtn">Retry level</button>
      <button class="big pink" id="menuBtn">Menu</button>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const R = Math.random, rnd = (a, b) => a + R() * (b - a), clamp = (v, a, b) => v < a ? a : v > b ? b : v;

// ---------- playfield (logical units; the canvas is scaled to fit the screen)
const W = 720, COLS = 12, ROWS = 12, BX = 24, BY = 140, BW = 56, BH = 26, BR = 8, TOP = 96;
// The field is 720 wide; on tall (phone) screens it grows taller so it fills the screen.
let H = 960, PY = 900;

const TYPES = {
  r: { c: '#ff4f6d', hp: 1 }, o: { c: '#ff8a2a', hp: 1 }, y: { c: '#f6c453', hp: 1 }, g: { c: '#9bf07a', hp: 1 },
  c: { c: '#4ff0e0', hp: 1 }, b: { c: '#4f8bff', hp: 1 }, p: { c: '#b48cff', hp: 1 }, m: { c: '#ff5fd2', hp: 1 },
  T: { c: '#c9c2d6', hp: 2 }, U: { c: '#f2f2f2', hp: 3 }, S: { c: '#6d7488', hp: Infinity },
  X: { c: '#ff3b3b', hp: 1, boom: true }, '?': { c: '#ffd23f', hp: 1, power: true },
};
const TYPE_NAMES = { r: 'Red', o: 'Orange', y: 'Yellow', g: 'Green', c: 'Cyan', b: 'Blue', p: 'Purple', m: 'Magenta',
  T: 'Tough (2 hits)', U: 'Hard (3 hits)', S: 'Steel (unbreakable)', X: 'Explosive', '?': 'Power-up brick' };

const LEVELS = [
  { name: 'Hello, neon', map: ['', '.rrrrrrrrrr.', '.oooooooooo.', '.yyyyyyyyyy.', '.gggggggggg.', '.cccccccccc.'] },
  { name: 'Pyramid', map: ['.....??.....', '....yyyy....', '...oooooo...', '..rrrrrrrr..', '.TTTTTTTTTT.', 'cccccccccccc'] },
  { name: 'Checkerboard', map: ['r.o.y.g.c.b.', '.r.o.y.g.c.b', 'r.o.y.g.c.b.', '.r.o.y.g.c.b', 'r.o.y.g.c.b.', '.T.T.T.T.T.T'] },
  { name: 'Fortress', map: ['SSSSSSSSSSSS', 'S..........S', 'S.yyyyyyyy.S', 'S.yXyyyyXy.S', 'S.yyyy?yyy.S', 'S..........S', 'SSSSS..SSSSS'] },
  { name: 'The Warden', boss: 'warden', map: ['', '', '', '', '', 'SS..T..T..SS'] },
  { name: 'Invaders', map: ['..p......p..', '...p....p...', '..pppppppp..', '.pp.pppp.pp.', 'pppppppppppp', 'p.pppppppp.p', 'p.p......p.p', '...pp..pp...'] },
  { name: 'Bombs away', map: ['XrXrXrXrXrXr', 'rrrrrrrrrrrr', 'TTTTTTTTTTTT', 'oXooXooXooXo', 'yyyyyyyyyyyy', 'UUUU?UU?UUUU'] },
  { name: 'Zigzag', map: ['gg..........', 'gggg........', '..gggg......', '....gggg....', '......gggg..', '........gggg', 'SS.....?..SS', '.cccccccccc.'] },
  { name: 'The vault', map: ['UUUUUUUUUUUU', 'USSSSSSSSSSU', 'US?TTTTTT?SU', 'USTXXXXXXTSU', 'UST??????TSU', 'USSSS..SSSSU'] },
  { name: 'The Hydra', boss: 'hydra', map: ['', '', '', '', '', 'S.TT....TT.S', '..X......X..'] },
  { name: 'Rainbow wall', map: ['rrrrrrrrrrrr', 'oooooooooooo', 'yyyyyyyyyyyy', 'gggggggggggg', 'cccccccccccc', 'bbbbbbbbbbbb', 'pppppppppppp', 'mmmmmmmmmmmm', 'TTTTTTTTTTTT'] },
  { name: 'Maze', map: ['SSSSS..SSSSS', 'S?....T....S', 'S.SSSSSSSS.S', 'S.byyyyyyb.S', 'S.SSSS.SSS.S', 'S....X.....S', 'SSSS....SSSS'] },
  { name: 'Diamond', map: ['.....UU.....', '....UTTU....', '...UT??TU...', '..UTXyyXTU..', '...UT??TU...', '....UTTU....', '.....UU.....'] },
  { name: 'Columns', map: ['r.o.y.g.c.b.', 'U.U.U.U.U.U.', 'r.o.y.g.c.b.', 'X.S.X.S.X.S.', 'r.o.y.g.c.b.', 'U.U.U.U.U.U.'] },
  { name: 'The Overmind', boss: 'overmind', map: ['', '', '', '', '', 'TTSTT..TTSTT', '.?........?.'] },
];
const BOSSES = {
  warden: { name: 'The Warden', hp: 30, w: 220, h: 62, speed: .7, shot: 2.1, spread: 1, color: '#ff4f6d' },
  hydra: { name: 'The Hydra', hp: 46, w: 240, h: 68, speed: .95, shot: 1.6, spread: 3, color: '#9bf07a' },
  overmind: { name: 'The Overmind', hp: 64, w: 260, h: 74, speed: 1.15, shot: 1.3, spread: 5, color: '#b48cff', summon: true },
};

const POWERS = {
  multi: { l: 'M', c: '#4ff0e0', w: 18, name: 'Multi-ball: two extra balls' },
  wide: { l: 'W', c: '#9bf07a', w: 16, name: 'Wide paddle' },
  laser: { l: 'L', c: '#ff4f6d', w: 12, name: 'Lasers fire from your paddle' },
  slow: { l: 'S', c: '#4f8bff', w: 12, name: 'Slow ball' },
  catch: { l: 'C', c: '#f6c453', w: 10, name: 'Catch: the ball sticks to you' },
  fire: { l: 'F', c: '#ff8a2a', w: 8, name: 'Fireball smashes straight through' },
  life: { l: '+', c: '#ff5fd2', w: 4, name: 'Extra life' },
  narrow: { l: 'N', c: '#8a90a3', w: 10, name: 'Narrow paddle (avoid it!)' },
};
const FX_TIME = { wide: 20, laser: 14, slow: 12, catch: 18, fire: 8, narrow: 12 };

// ---------- save data
const SAVE = 'neon-breakout-v1';
let rec = { hi: 0, unlocked: 1, custom: '' };
try { rec = Object.assign(rec, JSON.parse(localStorage.getItem(SAVE) || '{}')); } catch (e) {}
function save() { try { localStorage.setItem(SAVE, JSON.stringify(rec)); } catch (e) {} }

// ---------- sound
let AC = null;
function audio() { if (AC) { if (AC.state === 'suspended') AC.resume(); return; } try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
function tone(f, dur, v = .08, type = 'square', delay = 0, f2 = 0) {
  if (!AC) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + .02);
}
const sfx = {
  paddle: () => tone(330, .08, .08, 'square'),
  brick: n => tone(440 * Math.pow(1.06, Math.min(n, 24)), .07, .06, 'square'),
  steel: () => tone(1200, .05, .05, 'triangle'),
  boom: () => tone(140, .35, .14, 'sawtooth', 0, 40),
  power: () => { tone(660, .08, .07); tone(990, .1, .07, 'square', .08); },
  lose: () => tone(300, .5, .1, 'sawtooth', 0, 70),
  laser: () => tone(1400, .05, .03, 'sawtooth', 0, 700),
  boss: () => tone(200, .1, .1, 'square', 0, 120),
  win: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, .16, .08, 'square', i * .1)),
};

// ---------- state
let state = 'menu', G = null, mode = 'campaign', levelIdx = 0, editGrid = null, editType = 'r';
const keys = {};
let pointerX = null, shake = 0, time = 0, toastT = 0;
const balls = [], drops = [], lasers = [], shots = [], parts = [], flashes = [];
let grid = [], boss = null, brickCache = null, brickDirty = true;

function parseMap(rows) {
  const g = new Array(COLS * ROWS).fill(null);
  rows.forEach((row, y) => { for (let x = 0; x < COLS && x < row.length; x++) { const t = row[x]; if (TYPES[t] && y < ROWS) g[y * COLS + x] = { t, hp: TYPES[t].hp }; } });
  return g;
}
function mapToCode(g) {
  const rows = [];
  for (let y = 0; y < ROWS; y++) { let s = ''; for (let x = 0; x < COLS; x++) { const b = g[y * COLS + x]; s += b ? b.t : '.'; } rows.push(s); }
  while (rows.length && /^\.+$/.test(rows[rows.length - 1])) rows.pop();
  return 'NB1:' + rows.join('/');
}
function codeToMap(code) {
  const m = /^NB1:([rogycbpmTUSX?./]*)$/.exec(code.trim());
  if (!m) return null;
  return m[1].split('/').slice(0, ROWS);
}

function newGame(start) {
  G = { score: 0, lives: 3, combo: 0, fx: {}, padW: 120, padX: W / 2, stun: 0, laserT: 0, loop: 0 };
  startLevel(start);
}
function startLevel(i) {
  levelIdx = i;
  balls.length = drops.length = lasers.length = shots.length = parts.length = flashes.length = 0;
  G.fx = {}; G.combo = 0; G.stun = 0;
  let def;
  if (mode === 'custom') def = { name: 'Your level', map: codeToMap(rec.custom) || [] };
  else def = LEVELS[i % LEVELS.length];
  G.loop = mode === 'custom' ? 0 : Math.floor(i / LEVELS.length);
  G.name = def.name + (G.loop ? ` (loop ${G.loop + 1})` : '');
  grid = parseMap(def.map); brickDirty = true;
  boss = null;
  if (def.boss) {
    const b = BOSSES[def.boss];
    boss = Object.assign({}, b, { x: W / 2, y: 190, hp: b.hp * (1 + G.loop * .5), max: b.hp * (1 + G.loop * .5), t: 0, cd: 2, flash: 0, summonT: 8, dead: false });
  }
  newBall();
  state = 'intro'; G.introT = 1.6;
  if (mode === 'campaign' && i + 1 > rec.unlocked && i < LEVELS.length) { rec.unlocked = Math.min(LEVELS.length, i + 1); save(); }
}
const baseSpeed = () => Math.min(760, 430 + (levelIdx % LEVELS.length) * 9 + G.loop * 60);
function newBall() {
  balls.push({ x: G.padX, y: PY - BR - 1, dx: 0, dy: -1, sp: baseSpeed(), stuck: true, off: rnd(-20, 20), trail: [], stickT: 0 });
}
function launch() {
  if (state === 'intro') state = 'play';
  for (const b of balls) if (b.stuck) {
    b.stuck = false;
    const a = clamp(b.off / (G.padW / 2), -1, 1) * 1.0 + rnd(-.1, .1);
    b.dx = Math.sin(a); b.dy = -Math.cos(a);
  }
}

// ---------- bricks
const cell = (x, y) => (x >= 0 && y >= 0 && x < COLS && y < ROWS) ? grid[y * COLS + x] : null;
const brickRect = i => ({ x: BX + (i % COLS) * BW, y: BY + Math.floor(i / COLS) * BH });
function hitBrick(i, dmg, fromBall) {
  const b = grid[i]; if (!b) return false;
  const T = TYPES[b.t];
  if (T.hp === Infinity) { sfx.steel(); flash(i); return true; }
  b.hp -= dmg; brickDirty = true;
  if (b.hp > 0) { sfx.steel(); flash(i); return true; }
  breakBrick(i);
  return true;
}
function breakBrick(i) {
  const b = grid[i]; if (!b) return;
  const T = TYPES[b.t], r = brickRect(i);
  grid[i] = null; brickDirty = true;
  G.combo++;
  const mult = Math.min(5, 1 + Math.floor(G.combo / 4));
  G.score += (b.t === 'U' ? 150 : b.t === 'T' ? 100 : 50) * mult;
  sfx.brick(G.combo);
  for (let k = 0; k < 10; k++) parts.push({ x: r.x + rnd(4, BW - 4), y: r.y + rnd(4, BH - 4), vx: rnd(-160, 160), vy: rnd(-200, 80), life: rnd(.3, .7), c: T.c, s: rnd(2, 5) });
  if (T.power || R() < .13) spawnDrop(r.x + BW / 2, r.y + BH / 2);
  if (T.boom) {
    sfx.boom(); shake = Math.max(shake, 8);
    const x = i % COLS, y = Math.floor(i / COLS);
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const n = cell(x + dx, y + dy);
      if (n && TYPES[n.t].hp !== Infinity) breakBrick((y + dy) * COLS + x + dx);
    }
    for (let k = 0; k < 24; k++) parts.push({ x: r.x + BW / 2, y: r.y + BH / 2, vx: rnd(-320, 320), vy: rnd(-320, 320), life: rnd(.3, .6), c: pick(['#ff3b3b', '#ff8a2a', '#ffd23f']), s: rnd(3, 6) });
  }
}
const pick = a => a[Math.floor(R() * a.length)];
function flash(i) { flashes.push({ i, t: .12 }); }
function spawnDrop(x, y) {
  let s = 0; for (const k in POWERS) s += POWERS[k].w;
  let r = R() * s, type = 'multi';
  for (const k in POWERS) { r -= POWERS[k].w; if (r <= 0) { type = k; break; } }
  drops.push({ x, y, type, vy: 170 });
}
const breakableLeft = () => grid.some(b => b && TYPES[b.t].hp !== Infinity);

// ---------- update
function padWidth() { return G.fx.wide > 0 ? 180 : G.fx.narrow > 0 ? 78 : 120; }
function update(dt) {
  time += dt;
  if (toastT > 0 && (toastT -= dt) <= 0) $('toast').classList.remove('on');
  for (const p of parts) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 500 * dt; }
  for (let i = parts.length - 1; i >= 0; i--) if (parts[i].life <= 0) parts.splice(i, 1);
  for (const f of flashes) f.t -= dt;
  for (let i = flashes.length - 1; i >= 0; i--) if (flashes[i].t <= 0) flashes.splice(i, 1);
  shake *= Math.exp(-8 * dt);
  if (state === 'intro') { G.introT -= dt; if (G.introT <= 0) state = 'play'; movePaddle(dt); stickBalls(); return; }
  if (state === 'clear') { G.introT -= dt; if (G.introT <= 0) nextLevel(); return; }
  if (state !== 'play') return;

  for (const k in G.fx) if (G.fx[k] > 0) G.fx[k] -= dt;
  G.padW += (padWidth() - G.padW) * Math.min(1, dt * 10);
  movePaddle(dt);
  stickBalls();

  // balls
  const slow = G.fx.slow > 0 ? .62 : 1;
  for (const b of balls) {
    if (b.stuck) { b.stickT += dt; if (b.stickT > 3 && G.fx.catch > 0) { launch(); } continue; }
    const dist = b.sp * slow * dt, steps = Math.ceil(dist / 5);
    for (let s = 0; s < steps; s++) {
      b.x += b.dx * dist / steps; b.y += b.dy * dist / steps;
      if (b.x < BR) { b.x = BR; b.dx = Math.abs(b.dx); }
      if (b.x > W - BR) { b.x = W - BR; b.dx = -Math.abs(b.dx); }
      if (b.y < TOP + BR) { b.y = TOP + BR; b.dy = Math.abs(b.dy); }
      // paddle
      if (b.dy > 0 && b.y + BR >= PY && b.y + BR <= PY + 16 + dist && Math.abs(b.x - G.padX) <= G.padW / 2 + BR) {
        const off = clamp((b.x - G.padX) / (G.padW / 2), -1, 1), a = off * 1.05;
        b.dx = Math.sin(a); b.dy = -Math.cos(a); b.y = PY - BR;
        b.sp = Math.min(800, b.sp + 5); G.combo = 0; sfx.paddle();
        if (G.fx.catch > 0) { b.stuck = true; b.off = b.x - G.padX; b.stickT = 0; }
        break;
      }
      if (collideBricks(b)) continue;
      if (boss && !boss.dead) collideBoss(b);
    }
    // never let the ball settle into an almost-flat bounce

$('eTest').addEventListener('click', () => {
  if (!editGrid.some(b => b && TYPES[b.t].hp !== Infinity)) { toast('Add at least one breakable brick first'); return; }
  $('editBar').hidden = true; mode = 'custom'; newGame(0); resize();
});
$('eCopy').addEventListener('click', async () => {
  const code = mapToCode(editGrid);
  try { await navigator.clipboard.writeText(code); toast('Level code copied'); }
  catch (e) { window.prompt('Copy your level code:', code); }
});
$('ePaste').addEventListener('click', () => {
  const code = window.prompt('Paste a level code (it starts with NB1:)');
  if (!code) return;
  const m = codeToMap(code);
  if (!m) { toast("That isn't a level code"); return; }
  editGrid = parseMap(m); rec.custom = mapToCode(editGrid); save(); toast('Level loaded');
});
$('eDone').addEventListener('click', showMenu);

// ---------- input
function logicalX(e) { const r = cv.getBoundingClientRect(); return (e.clientX - r.left) / r.width * W; }
function logicalY(e) { const r = cv.getBoundingClientRect(); return (e.clientY - r.top) / r.height * H; }
addEventListener('pointermove', e => {
  if (state === 'edit') { if (painting) paintAt(logicalX(e), logicalY(e), painting === 2); return; }
  if (e.pointerType === 'mouse' || e.buttons || e.pressure > 0) pointerX = logicalX(e);
});
cv.addEventListener('pointerdown', e => {
  audio();
  if (state === 'edit') { painting = e.button === 2 ? 2 : 1; paintAt(logicalX(e), logicalY(e), painting === 2); return; }
  pointerX = logicalX(e);
  if (state === 'play' || state === 'intro') launch();
});
addEventListener('pointerup', () => { painting = 0; });
cv.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('keydown', e => {
  audio();
  keys[e.code] = true;
  if (['ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  if (e.code === 'Space' && (state === 'play' || state === 'intro')) launch();
  if ((e.code === 'KeyP' || e.code === 'Escape') && (state === 'play' || state === 'intro')) { G.paused = state; state = 'pause'; $('pause').hidden = false; }
  else if ((e.code === 'KeyP' || e.code === 'Escape') && state === 'pause') resume();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (state === 'play') { G.paused = 'play'; state = 'pause'; $('pause').hidden = false; } });
function resume() { state = G.paused || 'play'; $('pause').hidden = true; }

// ---------- menus
function showMenu() {
  state = 'menu'; mode = 'campaign';
  $('menu').hidden = false; $('over').hidden = true; $('pause').hidden = true; $('editBar').hidden = true;
  const lv = $('levels'); lv.textContent = '';
  LEVELS.forEach((L, i) => {
    const b = document.createElement('button');
    b.textContent = i + 1; b.title = L.name; b.disabled = i + 1 > rec.unlocked;
    if (L.boss) b.classList.add('boss');
    b.addEventListener('click', () => { audio(); mode = 'campaign'; $('menu').hidden = true; newGame(i); });
    lv.appendChild(b);
  });
  $('customBtn').hidden = !codeToMap(rec.custom || '');
  $('rec').textContent = '';
  if (rec.hi) { $('rec').append('High score '); $('rec').appendChild(Object.assign(document.createElement('b'), { textContent: rec.hi.toLocaleString('en-US') })); }
  resize();
}
$('playBtn').addEventListener('click', () => { audio(); mode = 'campaign'; $('menu').hidden = true; newGame(0); });
$('editBtn').addEventListener('click', openEditor);
$('customBtn').addEventListener('click', () => { audio(); mode = 'custom'; $('menu').hidden = true; newGame(0); });
$('resumeBtn').addEventListener('click', resume);
$('quitBtn').addEventListener('click', () => { save(); showMenu(); });
$('retryBtn').addEventListener('click', () => {
  $('over').hidden = true;
  if (mode === 'custom') { openEditor(); return; }
  newGame(levelIdx);
});
$('menuBtn').addEventListener('click', showMenu);
for (const k in POWERS) {
  const i = document.createElement('i'); i.textContent = POWERS[k].l; i.style.background = POWERS[k].c;
  const s = document.createElement('span'); s.textContent = POWERS[k].name;
  $('pwList').append(i, s);
}

let last = 0;
function frame(t) {
  requestAnimationFrame(frame);
  const dt = Math.min(.033, (t - last) / 1000 || 0); last = t;
  if (state !== 'pause' && state !== 'menu' && state !== 'over') update(dt);
  render();
}
buildPalette();
showMenu();
requestAnimationFrame(frame);
if (location.hash === '#debug') window.NB = { get G() { return G; }, balls, get grid() { return grid; }, get boss() { return boss; }, get state() { return state; }, startLevel, collect, LEVELS, breakBrick };
})();
</script>
</body>
</html>
