<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow+Semi+Condensed:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#10133a; --dusk:#e85d75; --sun:#f6c453; --ink:#fff4e2; --muted:#c9b9d8;
  --panel:rgba(16,19,58,.82); --edge:rgba(255,244,226,.18);
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--sky)}
body{margin:0;min-height:100vh;color:var(--ink);
  font-family:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  background:radial-gradient(120% 70% at 50% 0%,#2b1f5c 0%,var(--sky) 60%) fixed,var(--sky);
  padding:max(28px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom))}
main{max-width:920px;margin:0 auto}
h1{font-family:Bungee,Impact,"Arial Black",sans-serif;font-weight:400;font-size:clamp(44px,11vw,84px);line-height:.92;
  margin:12px 0 0;text-align:center;color:var(--sun);text-shadow:0 4px 0 #b9832a,0 0 40px rgba(246,196,83,.35)}
.lede{text-align:center;color:var(--muted);font-size:clamp(17px,2.6vw,20px);margin:14px auto 34px;max-width:34ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.game{display:flex;flex-direction:column;color:var(--ink);text-decoration:none;background:var(--panel);
  border:2px solid var(--edge);border-radius:18px;overflow:hidden;transition:transform .15s,border-color .15s}
.game:hover,.game:focus-visible{transform:translateY(-3px);border-color:var(--sun);outline:none}
.thumb{aspect-ratio:16/9;position:relative;overflow:hidden}
.info{padding:14px 16px 18px}
.info b{display:block;font-family:Bungee,Impact,sans-serif;font-weight:400;font-size:22px;margin-bottom:4px}
.info span{display:block;color:var(--muted);font-size:16px;line-height:1.35}
.play{display:inline-block;margin-top:12px;font-weight:700;font-size:16px;color:#2a0f1e;background:var(--sun);
  border-radius:999px;padding:6px 18px;box-shadow:0 4px 0 #b9832a}
.soon{display:grid;place-items:center;min-height:200px;border:2px dashed var(--edge);border-radius:18px;
  color:var(--muted);font-size:17px;text-align:center;padding:16px}

/* Night Coast Run thumbnail: sunset over a road */
.t-ncr{background:linear-gradient(#1b1a4d 0%,#5b2a6e 38%,#e85d75 55%,#f6c453 60%,#10133a 60%)}
.t-ncr::before{content:"";position:absolute;left:50%;top:32%;width:34%;aspect-ratio:1;transform:translateX(-50%);
  border-radius:50%;background:linear-gradient(#ffe08a,#f6c453 55%,#e85d75);
  -webkit-mask:linear-gradient(#000 0 58%,transparent 58% 63%,#000 63% 70%,transparent 70% 74%,#000 74%);
          mask:linear-gradient(#000 0 58%,transparent 58% 63%,#000 63% 70%,transparent 70% 74%,#000 74%)}
.t-ncr::after{content:"";position:absolute;left:0;right:0;top:60%;bottom:0;
  background:
    linear-gradient(var(--sun),var(--sun)) 50% 30%/1.2% 18% no-repeat,
    linear-gradient(var(--sun),var(--sun)) 50% 85%/2% 28% no-repeat,
    linear-gradient(#2c2c44,#3a3a58);
  clip-path:polygon(47% 0,53% 0,95% 100%,5% 100%)}
@media (prefers-reduced-motion: reduce){ .game{transition:none} .game:hover{transform:none} }
</style>
</head>
<body>
<main>
  <h1>Arcade</h1>
  <p class="lede">Pick a game.</p>
  <div class="grid" id="grid"></div>
</main>
<script>
// To add a game: put it in games/<id>/index.html and add an entry here.
// `thumb` is a CSS class that draws the card picture.
const GAMES = [
  {id:"night-coast-run", title:"Night Coast Run", thumb:"t-ncr",
   blurb:"Retro pseudo-3D driving: endless runs, jumps, police chases and derbies."},
];

const grid = document.getElementById("grid");
for (const g of GAMES) {
  const a = document.createElement("a");
  a.className = "game";
  a.href = `games/${g.id}/`;
  a.innerHTML = `<div class="thumb ${g.thumb}" aria-hidden="true"></div>
    <div class="info"><b></b><span></span><div class="play">Play</div></div>`;
  a.querySelector("b").textContent = g.title;
  a.querySelector("span").textContent = g.blurb;
  grid.appendChild(a);
}
const soon = document.createElement("div");
soon.className = "soon";
soon.textContent = "More games coming soon";
grid.appendChild(soon);
</script>
</body>
</html>
